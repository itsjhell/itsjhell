<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  <rect width="900" height="340" rx="10" fill="#0a0f12" stroke="#00ff9c" stroke-opacity="0.5"/>
  <rect width="900" height="32" rx="10" fill="#111a1f"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="16" r="6" fill="#27c93f"/>
  <text x="450" y="21" text-anchor="middle" font-family="monospace" font-size="13" fill="#6b8f80">itsjhell@kali: ~</text>

  <g font-family="'Courier New', monospace" font-size="16">
    <text x="24" y="70" fill="#00ff9c">$ <tspan fill="#e8fff6">whoami</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.045;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="24" y="96" fill="#8fb8a6">Giovanni Lamberti // itsjhell
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.10;0.105;1" dur="16s" repeatCount="indefinite"/></text>

    <text x="24" y="132" fill="#00ff9c">$ <tspan fill="#e8fff6">cat about.txt</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.205;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="24" y="158" fill="#8fb8a6">Master's student in Computer Engineering @ UniSA
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.26;0.265;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="24" y="180" fill="#8fb8a6">Focus: Cybersecurity, AI, constant evolution...
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.31;0.315;1" dur="16s" repeatCount="indefinite"/></text>

    <text x="24" y="216" fill="#00ff9c">$ <tspan fill="#e8fff6">./status.sh</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.41;0.415;1" dur="16s" repeatCount="indefinite"/></text>

    <!-- status lines: stack in quick succession -->
    <text x="24" y="242" fill="#ff003c">[!] LOW caffeine
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.485;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="210" y="242" fill="#ff003c" font-weight="bold">&lt;&lt; IMMEDIATE INTERVENTION REQUIRED
      <animate attributeName="opacity" values="0;0;1;1;0.25;1;1;0.25;1;1" keyTimes="0;0.53;0.535;0.62;0.64;0.66;0.85;0.87;0.89;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="24" y="264" fill="#00ff9c">[+] HIGH curiosity
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.565;1" dur="16s" repeatCount="indefinite"/></text>
    <text x="24" y="286" fill="#8fb8a6">[*] breaking things (legally)
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.645;1" dur="16s" repeatCount="indefinite"/></text>

    <text x="24" y="322" fill="#00ff9c">$ <tspan>█<animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.725;1" dur="16s" repeatCount="indefinite"/></text>
  </g>
</svg>
