    <text x="24" y="264" fill="#00ff9c">$ <tspan>█<animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.57;0.575;1" dur="16s" repeatCount="indefinite"/></text>
  </g>
